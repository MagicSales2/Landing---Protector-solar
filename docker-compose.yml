# ==========================================================
# 🐳 Docker Compose - Landing Skin Ofertas / Protector Solar
#
# El sitio se publica en dos sitios a la vez:
#   1. http://72.61.5.135:3001  -> el puerto 3001 de la máquina, para probar
#                                 rápido sin pasar por el dominio.
#   2. https://protectorsolar.skinoferta.cloud -> Traefik, con TLS de
#                                 Let's Encrypt. Eso lo pone el bloque de
#                                 etiquetas de abajo: Traefik las lee solo,
#                                 no hay que configurar nada a mano.
#
# Para cambiar el dominio o el correo del certificado hay que tocar el bloque
# "traefik.http.routers.protector-solar" y volver a levantar el contenedor.
# ==========================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anthelios_landing_web
    ports:
      # Se sigue publicando el 3001 para poder revisar el sitio en crudo.
      - "3001:80"
    restart: always
    environment:
      - NODE_ENV=production

    # ------------------------------------------------------------------
    # Traefik: publica el contenedor en el subdominio con HTTPS.
    # ------------------------------------------------------------------
    labels:
      # "Este contenedor quiere ser publicado por Traefik"
      - "traefik.enable=true"

      # Regla: este router atiende Requests de este dominio.
      - "traefik.http.routers.protector-solar.rule=Host(`protectorsolar.skinoferta.cloud`)"

      # Por dónde entra el tráfico: websecure es el puerto 443 de Traefik.
      - "traefik.http.routers.protector-solar.entrypoints=websecure"

      # Pide el certificado TLS.
      - "traefik.http.routers.protector-solar.tls=true"

      # Nombre del "certificates resolver" de Traefik. Tiene que coincidir con
      # el que esté configurado en el archivo de Traefik de la máquina; en este
      # servidor se llama "letsencrypt" porque ya está así para los demás
      # subdominios. Antes de cambiarlo, verificarlo con:
      #   docker exec <contenedor-traefik> cat /etc/traefik/traefik.yml
      - "traefik.http.routers.protector-solar.tls.certresolver=letsencrypt"

      # A dónde le manda el tráfico. Traefik y este contenedor están en la misma
      # máquina, así que en vez de dar la vuelta por internet, se le dice la
      # IP de la máquina y el puerto publicado.
      - "traefik.http.services.protector-solar.loadbalancer.serverscheme=http"
      - "traefik.http.services.protector-solar.loadbalancer.server.port=3001"
      - "traefik.http.services.protector-solar.loadbalancer.server.host=72.61.5.135"
