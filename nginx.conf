server {
    listen 80;
    listen [::]:80;
    server_name protectorsolar.skinoferta.cloud localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # --- Compresión -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/xml
        application/json
        application/manifest+json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # --- Caché ------------------------------------------------------------
    # CSS y JS llevan hash en el nombre (index-a1b2c3.js): si el contenido
    # cambia, cambia el nombre, así que se pueden cachear un año sin riesgo.
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imágenes, fuentes y video: sin hash en el nombre, así que un mes.
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|svg|svgz|webp|avif|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # El HTML NUNCA se cachea. Es el archivo que apunta a los JS y CSS con
    # hash: si el navegador lo guarda, sigue pidiendo los archivos del build
    # viejo aunque haya uno nuevo publicado. Con "no-cache" siempre valida y
    # una actualización se ve en la próxima visita.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # --- Rutas de la app (React) -----------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cabeceras de seguridad ------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Errores ----------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
